apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-app-deployment
  labels:
    app: water-monitor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: water-monitor
  template:
    metadata:
      labels:
        app: water-monitor
        spec:
      containers:
      - name: web-dashboard
        image: asihf/water-system:latest # Changed from placeholder to your real Docker username
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: water-app-service
spec:
  type: NodePort
  selector:
    app: water-monitor
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
